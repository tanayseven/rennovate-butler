name: renovate-butler

on:
  schedule:
    - cron: "30 14 * * *" # daily, 14:30 UTC = 20:00 IST (off the hour: top-of-hour schedules get dropped)
  # PRs that change the repo list (e.g. from scripts/add_repo.py) get a dry run as their check.
  pull_request:
    paths: [butler.yaml, .github/workflows/renovate-butler.yml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report decisions only (no merges, no fix PRs)"
        type: boolean
        default: true

# One live butler at a time: overlapping runs would race each other's merges.
# PR dry runs change nothing, so each PR gets its own group and a newer push cancels an older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('renovate-butler-pr-{0}', github.event.number) || 'renovate-butler' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow's own GITHUB_TOKEN only reads this repo. All work on the target
# repos uses the BUTLER_GITHUB_TOKEN secret (a PAT), because the built-in token
# cannot reach other repos and its pushes would not trigger their CI.
permissions:
  contents: read

jobs:
  butler:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Git identity for fix commits
        run: |
          git config --global user.name "renovate-butler"
          git config --global user.email "renovate-butler@users.noreply.github.com"

      - name: Run butler
        env:
          GITHUB_TOKEN: ${{ secrets.BUTLER_GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # PR dry runs stay out of Discord; the PR check is their report.
          DISCORD_WEBHOOK_URL: ${{ github.event_name != 'pull_request' && secrets.DISCORD_WEBHOOK_URL || '' }}
          # Scheduled runs are live; PRs always dry-run; manual runs default to dry-run.
          DRY_RUN: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && '--dry-run' || '' }}
        run: uv run renovate-butler --config butler.yaml $DRY_RUN run

      - name: Upload action log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: butler-log-${{ github.run_id }}
          path: butler.log.jsonl
          if-no-files-found: ignore
