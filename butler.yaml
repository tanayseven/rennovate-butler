# Used by the GitHub Actions workflow and local runs. No secrets here.
repos:
  - tanayseven/subhashitani
  - tanayseven/crt-screen-home-page
  - tanayseven/my-projects
  - tanayseven/tech-events-tracker
  - tanayseven/diwali
  - tanayseven/breakout-ebitengine
  - tanayseven/blog.tanay.tech
main_branch: main

merge:
  method: squash                 # merge | squash | rebase
  authors: ["renovate[bot]", "app/renovate"]
  min_confidence: low            # low | neutral | high | very high (low = any PR with a badge; the heal loop covers breakage)
  allowed_update_types: [patch, minor, major]   # majors too: a red PR gets repaired, a red main gets healed
  # PRs without a Merge Confidence badge (Actions, mise tools, Docker, lock files): judged by
  # Renovate's update type instead. 0.x minor bumps count as major. [] = never merge them.
  badgeless_update_types: [patch, minor, major, lockFileMaintenance]
  skip_labels: [do-not-merge]

fix:
  model: anthropic/claude-sonnet-5.5   # OpenRouter model id; checked at startup
  max_attempts: 3                      # fix attempts per red-main incident, and per red Renovate PR
  max_tool_turns: 40
  allow_local_checks: false            # true = model may run the workflow's run: steps locally
  label: renovate-butler

poll:
  interval_s: 30
  timeout_s: 3600
  no_ci_grace_s: 300

dry_run: false
log_file: butler.log.jsonl
